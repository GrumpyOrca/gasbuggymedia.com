<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem('gb-theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') {
      t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<style>
  :root { --paper:#ffffff; --ink:#1c1917; --body-c:#57534e; --sand:#a8a29e; --rust:#c2410c; --btn-bg:#1c1917; --btn-fg:#fff; }
  [data-theme="dark"] { --paper:#16120f; --ink:#ece4d8; --body-c:#b3a89c; --sand:#857b71; --rust:#e0561d; --btn-bg:#ece4d8; --btn-fg:#16120f; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:var(--paper); color:var(--ink); font-family:'Archivo',system-ui,sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px;
  }
  .kicker { font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--rust); margin-bottom:18px; }
  h1 { font-family:'Big Shoulders Display',sans-serif; font-weight:900; text-transform:uppercase; font-size:clamp(64px,14vw,160px); line-height:.9; }
  h1 span { color:var(--rust); }
  p { color:var(--body-c); margin:20px auto 32px; max-width:44ch; }
  a.home {
    display:inline-block; font-family:'Big Shoulders Display',sans-serif; font-weight:700; font-size:20px;
    letter-spacing:.08em; text-transform:uppercase; text-decoration:none;
    background:var(--btn-bg); color:var(--btn-fg); padding:14px 28px; transition:background .15s,color .15s;
  }
  a.home:hover { background:var(--rust); color:#fff; }
  .coords { margin-top:40px; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--sand); }
</style>
</head>
<body>
  <main>
    <div class="kicker">Incident report // GB-404</div>
    <h1>Dud <span>round.</span></h1>
    <p>This test site doesn't exist — the device failed to detonate, or the page
      was decommissioned. Either way, there's nothing buried here.</p>
    <a class="home" href="/">Return to base →</a>
    <div class="coords">36.68°N · 107.21°W (approx.) — nothing found at this location</div>
  </main>
</body>
